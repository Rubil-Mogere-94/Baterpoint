version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=baterpoint
      - POSTGRES_PASSWORD=baterpoint_secure_pass
      - POSTGRES_DB=baterpoint
    ports:
      - "5432:5432"

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/static:/app/static
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://baterpoint:baterpoint_secure_pass@db:5432/baterpoint
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
